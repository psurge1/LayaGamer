[project]
name = "layagamer"
version = "0.1.0"
description = "Local Laya game-playing experiments"
readme = "README.md"
authors = [
    { name = "psurge1", email = "suraj.sswamy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "laya>=0.3.20",
]

[project.scripts]
layagamer = "layagamer.main:main"
layagamer-web = "layagamer.web:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
