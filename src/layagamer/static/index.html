<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laya • Game lab</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><span class="brand">LAYA GAMER</span></header>
<main>
<section class="intro"><h1 id="game-title">Loading game…</h1></section>
<div class="game-picker"><label>Game <select id="game-select" disabled aria-label="Game"></select></label></div>
<div class="layout">
<section id="game-root" class="panel game" aria-label="Game workspace">Loading games…</section>
<section id="analysis" class="panel analysis"><div class="section-head"><h2>Choice probabilities</h2><span id="latency">NO INFERENCE YET</span></div>
<div id="history" class="history" aria-label="Decision history"></div>
<div id="snapshot" class="snapshot"></div>
<p id="chart-note" class="muted">Laya's first decision will appear here.</p>
<div id="chart" class="chart" aria-label="Choice probability histogram"></div>
<div id="context"></div>
<details id="request-details" hidden><summary>Full inference request & response</summary><pre id="request"></pre></details>
</section>
</div>
</main><script type="module" src="/app.js"></script>
</body></html>
